name: Block Plasma Android Debug CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: block-plasma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout clean Build repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install approved Flutter release
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Capture SDK versions
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v
      - name: Verify committed Android platform and lockfile
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle.kts
          test -f pubspec.lock
      - name: Resolve dependency graph
        run: flutter pub get
      - name: Assert resolved dependencies and Android sources are unchanged
        run: git diff --exit-code -- pubspec.lock android
      - name: Static analysis
        run: flutter analyze
      - name: Automated unit and widget tests
        run: flutter test --reporter expanded
      - name: Compile Android debug APK
        run: flutter build apk --debug
      - name: Record verified APK SHA-256
        run: |
          mkdir -p checksums
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee checksums/SHA256SUMS.txt
          git rev-parse HEAD | tee checksums/source-head.txt
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-plasma-android-debug-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            checksums/SHA256SUMS.txt
            checksums/source-head.txt
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    name: Android API 35 emulator state-restore smoke
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
    steps:
      - name: Checkout clean Build source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact debug APK from preceding job
        uses: actions/download-artifact@v4
        with:
          name: block-plasma-android-debug-${{ github.run_number }}
          path: downloaded-apk
      - name: Enable Linux KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm""' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot API 35 emulator and check cold-relaunch restore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android_emulator_smoke.sh
