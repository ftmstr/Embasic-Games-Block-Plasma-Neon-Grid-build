name: Block Plasma Android Debug CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: block-plasma-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout clean Build repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install approved Flutter release
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Capture SDK versions
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v
      - name: Verify committed Android platform and lockfile
        run: |
          test -f android/gradlew
          test -f android/gradle/wrapper/gradle-wrapper.jar
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/build.gradle.kts
          test -f pubspec.lock
      - name: Resolve dependency graph
        run: flutter pub get
      - name: Assert resolved dependencies and Android sources are unchanged
        run: git diff --exit-code -- pubspec.lock android
      - name: Static analysis
        run: flutter analyze
      - name: Automated unit and widget tests
        run: flutter test --reporter expanded
      - name: Compile Android debug APK
        run: flutter build apk --debug
      - name: Record verified APK SHA-256
        run: |
          mkdir -p checksums
          sha256sum build/app/outputs/flutter-apk/app-debug.apk | tee checksums/SHA256SUMS.txt
          git rev-parse HEAD | tee checksums/source-head.txt
      - name: Publish debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-plasma-android-debug-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            checksums/SHA256SUMS.txt
            checksums/source-head.txt
          if-no-files-found: error
          retention-days: 14

  android-emulator-smoke:
    name: Android API 35 emulator state-restore smoke
    needs: android-debug
    runs-on: ubuntu-latest
    timeout-minutes: 28
    permissions:
      contents: read
    steps:
      - name: Checkout clean Build source
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download exact debug APK from preceding job
        uses: actions/download-artifact@v4
        with:
          name: block-plasma-android-debug-${{ github.run_number }}
          path: downloaded-apk
      - name: Verify accelerated KVM is usable before emulator boot
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -e /dev/kvm ]]; then
            echo "::error::GitHub runner has no /dev/kvm; cannot run accelerated Android emulator"
            exit 1
          fi
          sudo chmod a+rw /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "EMULATOR-KVM-PERMISSIONS-PASS"
      - name: Boot API 35 emulator and check cold-relaunch restore
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-snapshot-load -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android_emulator_smoke.sh

      - name: Verify genuine Android emulator screenshots
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test "$(find android-gameplay-screens -maxdepth 1 -type f -name '*.png' | wc -l)" -eq 3
          find android-gameplay-screens -type f -name '*.png' -print0 | xargs -0 sha256sum | tee android-gameplay-screens/SHA256SUMS.txt
          git rev-parse HEAD | tee android-gameplay-screens/SOURCE_HEAD.txt
      - name: Publish original Android emulator gameplay captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-plasma-android-screen-captures-${{ github.run_number }}
          path: android-gameplay-screens/
          if-no-files-found: warn
          retention-days: 14

  flutter-screenshots:
    name: Capture original Flutter gameplay frames
    runs-on: ubuntu-latest
    timeout-minutes: 18
    permissions:
      contents: read
    steps:
      - name: Checkout exact original Flutter sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install pinned Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Resolve locked dependencies
        run: |
          flutter pub get
          git diff --exit-code -- pubspec.lock
      - name: Render and capture actual Flutter UI (not AI images)
        run: flutter test --update-goldens --reporter expanded tool/capture_gameplay_test.dart
      - name: Verify screenshots and provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(find tool/goldens -maxdepth 1 -name '*.png' -type f | wc -l)" -eq 4
          find tool/goldens -maxdepth 1 -name '*.png' -type f -print0 | xargs -0 -n1 file
          find tool/goldens -maxdepth 1 -name '*.png' -type f -print0 | xargs -0 sha256sum | tee screenshot-sha256.txt
          git rev-parse HEAD | tee screenshot-source-head.txt
      - name: Publish real Flutter renderer screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: block-plasma-flutter-screens-${{ github.run_number }}
          path: |
            tool/goldens/*.png
            screenshot-sha256.txt
            screenshot-source-head.txt
          if-no-files-found: error
          retention-days: 14
